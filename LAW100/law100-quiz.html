<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LAW100 Quiz</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Caveat:wght@500;700&display=swap" rel="stylesheet"><style>:root{--pink:oklch(85% 0.08 350);--mint:oklch(88% 0.08 160);--lavender:oklch(85% 0.08 290);--yellow:oklch(92% 0.08 90);--peach:oklch(88% 0.08 50);--cyan:oklch(88% 0.08 200);--dark:oklch(25% 0.02 280);--text:oklch(30% 0.01 280);--white:oklch(98% 0.005 280);--correct:oklch(85% 0.1 145);--wrong:oklch(88% 0.08 25)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Patrick Hand',cursive;background:var(--white);color:var(--text);font-size:17px;line-height:1.5;min-height:100vh;padding-bottom:60px}.header{background:var(--lavender);padding:32px 20px;text-align:center}.header h1{font-family:'Bangers',cursive;font-size:clamp(1.8rem,5vw,2.8rem);color:var(--dark);text-shadow:2px 2px 0 oklch(70% .08 290)}.header p{font-family:'Caveat',cursive;font-size:1.1rem;color:oklch(35% .04 290)}.back{display:inline-block;margin:16px 20px;font-family:'Bangers',cursive;font-size:.9rem;padding:6px 14px;border-radius:16px;background:var(--dark);color:var(--white);text-decoration:none}.controls{max-width:700px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:20px}.controls select{font-family:'Patrick Hand',cursive;font-size:.9rem;padding:5px 10px;border-radius:8px;border:2px solid oklch(70% .06 290);background:var(--white)}.controls .score{font-family:'Bangers',cursive;font-size:1rem}.controls .score .right{color:oklch(40% .15 145)}.controls .score .wrong{color:oklch(40% .15 25)}.quiz-area{max-width:700px;margin:0 auto;padding:0 20px}.q-card{background:var(--white);border:3px solid oklch(75% .06 290);border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:3px 3px 0 oklch(75% .06 290)}.q-card .q-num{font-family:'Bangers',cursive;font-size:.85rem;color:oklch(50% .06 280);margin-bottom:6px}.q-card .q-topic{font-family:'Caveat',cursive;font-size:.8rem;background:var(--yellow);padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:10px}.q-card .question{font-size:1.1rem;font-weight:600;margin-bottom:14px;color:var(--dark)}.options{display:flex;flex-direction:column;gap:8px}.option{padding:12px 16px;border-radius:10px;border:2px solid oklch(80% .04 280);background:oklch(97% .01 280);cursor:pointer;transition:all .2s;font-size:1rem}.option:hover:not(.disabled){background:oklch(93% .04 290);border-color:oklch(65% .08 290)}.option.selected{border-color:oklch(60% .1 290);background:oklch(90% .05 290)}.option.correct{background:var(--correct);border-color:oklch(60% .12 145)}.option.incorrect{background:var(--wrong);border-color:oklch(60% .1 25)}.option.disabled{cursor:default;opacity:.8}.feedback{margin-top:12px;padding:12px 14px;border-radius:8px;display:none;font-size:.95rem;line-height:1.5}.feedback.show{display:block}.feedback.correct-fb{background:var(--correct)}.feedback.incorrect-fb{background:var(--wrong)}.done-screen{display:none;text-align:center;padding:40px 20px;max-width:500px;margin:0 auto}.done-screen h2{font-family:'Bangers',cursive;font-size:2rem;margin-bottom:12px}.done-screen .final{font-family:'Caveat',cursive;font-size:1.5rem;font-weight:700}.restart-btn{font-family:'Bangers',cursive;font-size:1rem;padding:10px 24px;border-radius:20px;border:none;background:var(--lavender);color:var(--dark);cursor:pointer;margin-top:16px}@media(max-width:500px){.q-card{padding:16px}}</style></head><body><div class="header"><h1>📝 LAW100 Quiz</h1><p>MCQ with instant feedback | All Topics</p></div><a href="../index.html" class="back">← Back to Hub</a><div class="controls"><select id="topicFilter" onchange="startQuiz()"><option value="all">All Topics</option><option value="1">T1 Foundations</option><option value="2">T2 Indigenous</option><option value="3">T3 Case Law</option><option value="4">T4 Courts</option><option value="5">T5 Judicial</option><option value="6">T6 Legislation</option><option value="7">T7 Interp I</option><option value="8">T8 Interp II</option><option value="9">T9 Presumptions</option><option value="10">T10 Obligations</option></select><div class="score"><span class="right" id="rightCount">✓ 0</span> &nbsp; <span class="wrong" id="wrongCount">✗ 0</span></div></div><div class="quiz-area" id="quizArea"></div><div class="done-screen" id="doneScreen"><h2>🎉 Quiz Complete!</h2><div class="final" id="finalScore"></div><button class="restart-btn" onclick="startQuiz()">Go Again</button></div><script>const questions=[{t:'1',q:'Australia is classified as which type of legal system?',opts:['Civil law','Common law','Sharia law','Customary law'],ans:1,exp:'Australia inherited the English common law system through colonisation. Civil law countries (Europe) use comprehensive codes.'},{t:'1',q:'What does s 109 of the Constitution provide?',opts:['States can override Commonwealth law','Commonwealth law prevails over inconsistent State law','The High Court can override Parliament','International law prevails over domestic law'],ans:1,exp:'Section 109: when a State law is inconsistent with a Commonwealth law, the Cth law prevails to the extent of the inconsistency.'},{t:'1',q:'Which Act ended the remaining UK legal ties to Australia?',opts:['Statute of Westminster 1931','Colonial Laws Validity Act 1865','Australia Acts 1986','Constitution Act 1901'],ans:2,exp:'The Australia Acts 1986 (Cth & UK) ended the application of any UK legislation to Australia, completing full legal independence.'},{t:'1',q:'What are Dicey\'s three principles of the rule of law?',opts:['Separation of powers, federalism, democracy','Supremacy of law, govt needs authority, equality before law','Parliamentary sovereignty, judicial review, habeas corpus','Liberty, equality, fraternity'],ans:1,exp:'Dicey: (1) Absolute supremacy of law over arbitrary power; (2) Government can only act with specific legal authority; (3) Everyone is equally subject to the law.'},{t:'2',q:'What did Mabo v Queensland [No 2] (1992) establish?',opts:['Australia was terra nullius','Native title cannot coexist with Crown title','Australia was NOT terra nullius; native title recognised','Aboriginal customary law overrides statute'],ans:2,exp:'Mabo held Australia was NOT terra nullius. Crown radical title coexists with beneficial native title where Indigenous people maintain traditional connection.'},{t:'2',q:'What does Crimes Act 1914 (Cth) s 166A provide?',opts:['Customary law can reduce sentences','Courts must not use customary law to excuse criminal behaviour','Indigenous sentencing courts are mandatory','Payback is a valid defence'],ans:1,exp:'s 166A: courts must NOT take into account any customary law or cultural practice as a reason for excusing, justifying, or lessening seriousness of criminal behaviour.'},{t:'3',q:'What is the "ratio decidendi" of a case?',opts:['The judge\'s passing remarks','The binding legal principle on the material facts','The procedural history','The dissenting opinion'],ans:1,exp:'Ratio decidendi = "reason for the decision." The binding legal principle the judge applied to the material facts. Only this part creates precedent.'},{t:'3',q:'Which of these is NOT a purpose of the doctrine of precedent (per Telstra v Treloar)?',opts:['Certainty','Equality','Flexibility','Efficiency'],ans:2,exp:'Telstra v Treloar identifies 4 purposes: Certainty, Equality, Efficiency, and Appearance of justice. Flexibility is not one; precedent restricts flexibility by design.'},{t:'3',q:'What does "per incuriam" mean?',opts:['By analogy','Through want of care','In passing','By the court'],ans:1,exp:'Per incuriam = "through want of care." A decision made in ignorance of a binding authority or relevant statute. May be treated as plainly wrong.'},{t:'4',q:'What does Farah Constructions v Say-Dee (2007) require of intermediate appellate courts?',opts:['They must always follow the High Court','They should follow other states on Cth legislation unless plainly wrong','They can never overrule themselves','They must seek leave before departing from precedent'],ans:1,exp:'Farah requires intermediate appellate courts to follow other states\' appellate decisions on Commonwealth/uniform legislation unless "plainly wrong."'},{t:'4',q:'What happens when the High Court is equally divided on appeal?',opts:['The Chief Justice has a casting vote','The appeal is reheard','The decision below is affirmed','The matter is referred to Parliament'],ans:2,exp:'Judiciary Act s 23(2)(a): when equally divided, the decision being appealed is affirmed (stands). No binding precedent is created.'},{t:'5',q:'What is the standard of proof in criminal cases?',opts:['Balance of probabilities','Beyond reasonable doubt','Clear and convincing evidence','Preponderance of evidence'],ans:1,exp:'Criminal: beyond reasonable doubt (prosecution bears burden). Civil cases use balance of probabilities (plaintiff bears burden).'},{t:'5',q:'In Cattanach v Melchior (2003), what did the High Court decide?',opts:['Wrongful life claim allowed','Child-rearing damages denied on policy grounds','Child-rearing damages awarded (4:3) applying negligence','Case remitted to trial court'],ans:2,exp:'4:3 HC awarded child-rearing damages. Majority applied general negligence principles (duty, breach, damage all conceded). Dissent argued policy should create exception.'},{t:'6',q:'What is the default commencement date for a Commonwealth statute?',opts:['Immediately on Royal Assent','7 days after assent','28 days after assent','Date proclaimed in Gazette'],ans:2,exp:'Acts Interpretation Act 1901 (Cth) s 3A: 28 days after assent unless another date is specified in the Act itself.'},{t:'6',q:'A definition using "means" is:',opts:['Open and illustrative','Closed and exhaustive','Discretionary','Presumptive'],ans:1,exp:'"Means" = closed/exhaustive (only what\'s listed). "Includes" = open/illustrative (not limited to what\'s listed).'},{t:'6',q:'What does "generalia specialibus non derogant" mean?',opts:['General words override specific ones','Specific provisions override general ones','General provisions don\'t impliedly repeal specific ones','The Crown is not bound'],ans:2,exp:'General things do not derogate from specific things. A later general provision does NOT impliedly repeal an earlier specific provision.'},{t:'7',q:'What does s 15AA of the AIA 1901 (Cth) require?',opts:['Literal interpretation always','The purposive interpretation is to be preferred','Extrinsic materials must be consulted','Courts can rewrite ambiguous statutes'],ans:1,exp:'s 15AA: "the interpretation that would best achieve the purpose or object of the Act is to be preferred to each other interpretation."'},{t:'7',q:'What is the "golden rule" of interpretation?',opts:['Always follow the literal meaning','Depart from literal meaning to avoid absurdity','Use extrinsic materials first','Apply the mischief rule'],ans:1,exp:'The golden rule permits departure from the grammatical/ordinary meaning of words to avoid a result that would be absurd (Grey v Pearson 1857).'},{t:'7',q:'CIC Insurance v Bankstown FC (1997) established that:',opts:['Extrinsic materials are never permitted','Context must be considered only when ambiguity arises','Context must be considered from the start, in its widest sense','The literal approach is always preferred'],ans:2,exp:'CIC Insurance: context must be considered from the start (not just when ambiguity arises) and includes the state of the law and the mischief the statute was intended to remedy.'},{t:'8',q:'What does "ejusdem generis" mean?',opts:['The express mention of one excludes another','General words are limited to the same kind as preceding specific words','A word is known from its companions','General doesn\'t override specific'],ans:1,exp:'Ejusdem generis: general words following specific words are limited to the same kind/category (genus) as the specific words listed.'},{t:'8',q:'Under s 15AB, when can extrinsic materials DETERMINE (not just confirm) meaning?',opts:['Always, without restriction','Only when the provision is ambiguous/obscure OR ordinary meaning is manifestly absurd','Only when the Minister requests it','Only in constitutional cases'],ans:1,exp:'s 15AB threshold test: extrinsic materials can determine meaning when (i) provision is ambiguous/obscure OR (ii) ordinary meaning in context produces manifestly absurd/unreasonable result.'},{t:'9',q:'What is the effect of the "principle of legality" (Coco 1994)?',opts:['Parliament cannot legislate on fundamental rights','Fundamental rights can only be impliedly displaced where necessary to prevent the provision becoming meaningless','Courts can strike down legislation','International law overrides domestic statutes'],ans:1,exp:'Coco (1994): fundamental rights can only be impliedly displaced where NECESSARY to prevent the provision becoming meaningless/inoperative. Rarely possible through general words alone.'},{t:'9',q:'How are presumptions in statutory interpretation displaced?',opts:['By any legislative provision','By clear and unambiguous words or necessary implication','Only by constitutional amendment','They cannot be displaced'],ans:1,exp:'All presumptions are rebuttable by "clear and unambiguous words" or "necessary implication." The stronger the presumption, the clearer the language must be.'},{t:'10',q:'In Re M (1924), what happened to the word "may"?',opts:['It was held to be discretionary','It was held to impose an obligation','It was held to be unconstitutional','It was held to be ambiguous'],ans:1,exp:'"May" was held OBLIGATORY because the purpose of the Act was to ensure the register was accurate. Purpose required action, not choice.'},{t:'10',q:'What is the key principle from Project Blue Sky v ABA (1998) about invalidity?',opts:['All breaches produce invalidity','Breach of a condition does NOT necessarily produce invalidity','Only criminal breaches produce invalidity','Courts cannot assess validity'],ans:1,exp:'An act done in breach of a condition is NOT necessarily invalid. Ask: was it Parliament\'s purpose that breach should produce invalidity? Consider language, subject matter, objects, consequences.'}];let deck=[],score=0,wrong=0,current=0;function startQuiz(){const v=document.getElementById('topicFilter').value;deck=v==='all'?[...questions]:questions.filter(q=>q.t===v);shuffle(deck);score=0;wrong=0;current=0;document.getElementById('doneScreen').style.display='none';updateScore();renderAll()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function updateScore(){document.getElementById('rightCount').textContent='\u2713 '+score;document.getElementById('wrongCount').textContent='\u2717 '+wrong}function renderAll(){const area=document.getElementById('quizArea');area.innerHTML='';deck.forEach((q,i)=>{const topicLabels={1:'Foundations',2:'Indigenous',3:'Case Law',4:'Courts',5:'Judicial',6:'Legislation',7:'Interp I',8:'Interp II',9:'Presumptions',10:'Obligations'};const div=document.createElement('div');div.className='q-card';div.id='q-'+i;let optsHtml=q.opts.map((o,j)=>`<div class="option" data-q="${i}" data-o="${j}" onclick="checkAnswer(${i},${j})">${o}</div>`).join('');div.innerHTML=`<div class="q-num">Question ${i+1} of ${deck.length}</div><span class="q-topic">T${q.t} ${topicLabels[q.t]}</span><div class="question">${q.q}</div><div class="options">${optsHtml}</div><div class="feedback" id="fb-${i}"></div>`;area.appendChild(div)})}function checkAnswer(qi,oi){const q=deck[qi];const opts=document.querySelectorAll(`[data-q="${qi}"]`);const fb=document.getElementById('fb-'+qi);if(opts[0].classList.contains('disabled'))return;opts.forEach(o=>{o.classList.add('disabled');const idx=parseInt(o.dataset.o);if(idx===q.ans)o.classList.add('correct');});if(oi===q.ans){opts[oi].classList.add('correct');fb.className='feedback show correct-fb';fb.innerHTML='<strong>\u2713 Correct!</strong> '+q.exp;score++}else{opts[oi].classList.add('incorrect');opts[q.ans].classList.add('correct');fb.className='feedback show incorrect-fb';fb.innerHTML='<strong>\u2717 Not quite.</strong> '+q.exp;wrong++}updateScore();checkDone()}function checkDone(){const answered=score+wrong;if(answered===deck.length){setTimeout(()=>{document.getElementById('doneScreen').style.display='block';const pct=Math.round((score/deck.length)*100);document.getElementById('finalScore').innerHTML=`You got <strong>${score}</strong> out of <strong>${deck.length}</strong> (${pct}%)`;},600)}}startQuiz();</script></body></html>
