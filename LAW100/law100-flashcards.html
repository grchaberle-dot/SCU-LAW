<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LAW100 Flashcards</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Caveat:wght@500;700&display=swap" rel="stylesheet"><style>:root{--pink:oklch(85% 0.08 350);--mint:oklch(88% 0.08 160);--lavender:oklch(85% 0.08 290);--yellow:oklch(92% 0.08 90);--peach:oklch(88% 0.08 50);--cyan:oklch(88% 0.08 200);--dark:oklch(25% 0.02 280);--text:oklch(30% 0.01 280);--white:oklch(98% 0.005 280)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Patrick Hand',cursive;background:var(--pink);color:var(--text);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}.header{text-align:center;margin-bottom:16px}.header h1{font-family:'Bangers',cursive;font-size:clamp(2rem,5vw,3rem);color:var(--dark);text-shadow:2px 2px 0 oklch(70% .1 350)}.header p{font-family:'Caveat',cursive;font-size:1.1rem;color:oklch(35% .04 350)}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:20px}.controls select{font-family:'Patrick Hand',cursive;font-size:.9rem;padding:5px 10px;border-radius:8px;border:2px solid oklch(70% .06 290);background:var(--white)}.shuf-btn{font-family:'Bangers',cursive;font-size:.9rem;padding:8px 20px;border-radius:20px;border:none;cursor:pointer;background:oklch(55% .2 340);color:var(--white);transition:transform .15s}.shuf-btn:hover{transform:scale(1.06)}.counter{font-family:'Bangers',cursive;font-size:1.1rem;color:oklch(40% .08 350)}.card-wrap{width:100%;max-width:600px;perspective:1200px;margin-bottom:20px}.card{width:100%;min-height:300px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,1,.36,1)}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.front{background:var(--white);border:3px solid oklch(70% .08 290);box-shadow:4px 4px 0 oklch(60% .1 290)}.back{background:var(--lavender);border:3px solid oklch(60% .08 290);box-shadow:4px 4px 0 oklch(50% .1 290);transform:rotateY(180deg)}.front .badge{position:absolute;top:12px;left:12px;font-family:'Caveat',cursive;font-size:.85rem;font-weight:700;background:var(--mint);padding:2px 8px;border-radius:8px}.front .q{font-size:1.2rem;color:var(--dark);max-width:90%}.front .hint{font-family:'Caveat',cursive;font-size:.9rem;color:oklch(55% .04 280);margin-top:14px}.back .badge{position:absolute;top:12px;left:12px;font-family:'Bangers',cursive;font-size:.8rem;background:var(--mint);padding:2px 8px;border-radius:8px}.back .a{font-size:1.05rem;color:var(--dark);max-width:92%;line-height:1.6}.nav-row{display:flex;gap:16px;align-items:center;margin-bottom:12px}.nav-btn{width:48px;height:48px;border-radius:50%;border:3px solid var(--dark);background:var(--white);font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}.nav-btn:hover{transform:scale(1.1)}.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:400px}.dot{width:10px;height:10px;border-radius:50%;background:oklch(75% .04 350);transition:all .2s}.dot.active{background:oklch(50% .15 340);transform:scale(1.3)}@media(max-width:500px){.face{padding:24px 16px}.front .q{font-size:1.05rem}}</style></head><body><div class="header"><h1>FLASHCARDS</h1><p>LAW100 — All Topics ✨</p></div><div class="controls"><select id="topicFilter" onchange="filterCards()"><option value="all">All Topics</option><option value="1">T1 Foundations</option><option value="2">T2 Indigenous</option><option value="3">T3 Case Law</option><option value="4">T4 Courts</option><option value="5">T5 Judicial</option><option value="6">T6 Legislation</option><option value="7">T7 Interp I</option><option value="8">T8 Interp II</option><option value="9">T9 Presumptions</option><option value="10">T10 Obligations</option></select><button class="shuf-btn" onclick="shuffleDeck()">🔀 SHUFFLE</button></div><div class="counter" id="counter">1 / 20</div><div class="card-wrap"><div class="card" id="card" onclick="this.classList.toggle('flipped')"><div class="face front"><span class="badge" id="fbadge">T1</span><div class="q" id="fq">Loading...</div><div class="hint">tap to flip</div></div><div class="face back"><span class="badge">ANSWER</span><div class="a" id="fa">Loading...</div></div></div></div><div class="nav-row"><button class="nav-btn" onclick="prev()">←</button><button class="nav-btn" onclick="next()">→</button></div><div class="dots" id="dots"></div><script>const all=[{t:'1',q:'What are the two sources of law in Australia?',a:'Case law (common law / judge-made) and Legislation (statutes by Parliament + delegated legislation).'},{t:'1',q:'What 3 courts emerged from the Curia Regis?',a:'Court of Common Pleas (commoner disputes), Court of Exchequer (revenue), King\'s Bench (royal interests).'},{t:'1',q:'What does s 109 of the Constitution provide?',a:'When State law conflicts with Commonwealth law, the Cth law prevails to the extent of the inconsistency.'},{t:'1',q:'Name the 3 branches in the separation of powers.',a:'Legislature (Parliament: makes laws), Executive (Cabinet/GG: administers), Judiciary (Courts: interprets/applies).'},{t:'1',q:'What are Dicey\'s 3 principles of the rule of law?',a:'(1) Supremacy of law over arbitrary power; (2) Govt needs specific legal authority; (3) Everyone equally subject to law.'},{t:'1',q:'What did the Australia Acts 1986 achieve?',a:'Ended remaining UK legal ties, completing Australia\'s journey to full legal independence.'},{t:'2',q:'What did Mabo v Queensland [No 2] (1992) establish?',a:'Australia was NOT terra nullius. Crown\'s radical title coexists with beneficial native title where traditional connection is maintained.'},{t:'2',q:'What does Native Title Act 1993 s 223 define?',a:'Native title: communal/group/individual rights in land/waters possessed under traditional laws where connection maintained.'},{t:'2',q:'What does Crimes Act 1914 s 166A say?',a:'Courts must NOT use customary law/cultural practice to excuse, justify, or lessen the seriousness of criminal behaviour.'},{t:'3',q:'What 4 purposes does precedent serve? (Telstra v Treloar)',a:'Certainty (clear guide), Equality (like cases alike), Efficiency (no relitigating), Appearance of justice (impersonal/reasoned).'},{t:'3',q:'What is the ratio decidendi?',a:'The reason for the decision: the binding legal principle applied to the material facts. Only this creates precedent.'},{t:'3',q:'What is obiter dicta?',a:'Remarks in passing. Not essential to the decision. Persuasive but not binding (though HC obiter should generally be followed).'},{t:'3',q:'What does IRAC stand for?',a:'Issue, Rule, Application, Conclusion. The framework for structured legal problem-solving.'},{t:'4',q:'What court sits at the apex of ALL hierarchies?',a:'The High Court of Australia (7 justices). Its rationes bind all courts.'},{t:'4',q:'What does Farah Constructions (2007) require?',a:'Intermediate appellate courts should follow other states\' appellate decisions on Cth/uniform legislation unless plainly wrong.'},{t:'4',q:'What happens when the HC is equally divided on appeal?',a:'Judiciary Act s 23(2)(a): decision below is affirmed. No binding precedent created by statutory majority.'},{t:'5',q:'What is the standard of proof: criminal vs civil?',a:'Criminal: beyond reasonable doubt (prosecution). Civil: balance of probabilities (plaintiff).'},{t:'5',q:'What 3 sources guide courts in novel cases?',a:'Legal authority (past cases), Legal principle (generalised doctrines), Legal policy (broader social impact/fairness).'},{t:'6',q:'What are the 5 steps in making a statute?',a:'(1) Proposal; (2) Cabinet approval; (3) Drafting; (4) Passage through Parliament (3 readings); (5) Royal Assent.'},{t:'6',q:'Closed vs open definitions in legislation?',a:'Closed = "means" (exhaustive, only what\'s listed). Open = "includes" (illustrative, not limited to listed items).'},{t:'7',q:'What does s 15AA of the AIA require?',a:'The interpretation that best achieves the purpose/object of the Act is to be preferred to each other interpretation.'},{t:'7',q:'What are the 4 questions from Heydon\'s Case (1584)?',a:'(1) What was prior law? (2) What mischief? (3) What remedy? (4) True reason of remedy. Courts suppress mischief, advance remedy.'},{t:'7',q:'What is the modern approach (CIC Insurance 1997)?',a:'Context must be considered from the start (not just when ambiguity arises), in widest sense including state of law and mischief.'},{t:'8',q:'What does ejusdem generis mean?',a:'General words following specific words are limited to the same kind/category as the specific words. Requires a common genus.'},{t:'8',q:'What is the s 15AB threshold test?',a:'Either: (i) provision is ambiguous/obscure; OR (ii) ordinary meaning in context/purpose produces manifestly absurd/unreasonable result.'},{t:'8',q:'What did Re Bolton (1987) establish?',a:'The words of the Minister must not be substituted for the text of the law. Court gives effect to enacted text.'},{t:'9',q:'What are presumptions in statutory interpretation?',a:'Common law assumptions about Parliament\'s purpose. Grounded in liberal democratic values. Act as "common law bill of rights." All rebuttable.'},{t:'9',q:'What does Coco (1994) say about fundamental rights?',a:'Only impliedly displaced where NECESSARY to prevent provision becoming meaningless/inoperative. Rarely by general words alone.'},{t:'9',q:'What is a privative clause?',a:'Provision purporting to deny court access/prevent judicial review. Strictly construed. Can\'t prevent review for jurisdictional error (S157/2002).'},{t:'10',q:'What are the 3 Project Blue Sky factors?',a:'(A) Regulates existing power or preliminaries? (B) Rule-like quality? (C) Invalidity = significant public inconvenience?'},{t:'10',q:'Does breach always produce invalidity?',a:'No. Ask: was it Parliament\'s PURPOSE that breach should produce invalidity? Look at language, subject matter, objects, consequences.'}];let deck=[...all],idx=0;function filterCards(){const v=document.getElementById('topicFilter').value;deck=v==='all'?[...all]:all.filter(c=>c.t===v);shuffle(deck);idx=0;render()}function shuffleDeck(){shuffle(deck);idx=0;render()}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function render(){if(!deck.length)return;const c=deck[idx];document.getElementById('fq').textContent=c.q;document.getElementById('fa').textContent=c.a;document.getElementById('fbadge').textContent='T'+c.t;document.getElementById('counter').textContent=(idx+1)+' / '+deck.length;document.getElementById('card').classList.remove('flipped');renderDots()}function renderDots(){const el=document.getElementById('dots');el.innerHTML='';deck.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===idx?' active':'');el.appendChild(d)})}function next(){idx=(idx+1)%deck.length;render()}function prev(){idx=(idx-1+deck.length)%deck.length;render()}shuffleDeck();</script></body></html>
