<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CRIM107 Quiz | UNE Study Hub</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Caveat:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Patrick Hand',cursive;background:linear-gradient(135deg,#f0e6ff 0%,#e8f4f8 50%,#fff0f5 100%);min-height:100vh;padding:20px}.back{display:inline-block;margin-bottom:20px;color:#6b21a8;text-decoration:none;font-size:1.2rem;border:2px dashed #6b21a8;padding:5px 15px;border-radius:20px}.back:hover{background:#6b21a8;color:white}h1{font-family:'Bangers',cursive;color:#6b21a8;font-size:2.5rem;text-align:center;text-shadow:2px 2px 0 #fbbf24;margin-bottom:5px}.subtitle{text-align:center;font-family:'Caveat',cursive;color:#be185d;font-size:1.3rem;margin-bottom:20px}.container{max-width:750px;margin:0 auto}.q-card{background:white;border:3px dashed #c084fc;border-radius:20px;padding:25px;margin:15px 0;box-shadow:4px 4px 0 #fbbf24}.q-num{font-family:'Bangers',cursive;color:#6b21a8;font-size:1.1rem;margin-bottom:8px}.q-text{font-size:1.2rem;margin-bottom:15px;line-height:1.4}.options{display:flex;flex-direction:column;gap:8px}.opt{padding:12px 18px;border:2px solid #e9d5ff;border-radius:12px;cursor:pointer;transition:all 0.2s;font-size:1.05rem}.opt:hover{background:#f5f0ff;border-color:#c084fc}.opt.correct{background:#d1fae5;border-color:#10b981;color:#065f46}.opt.wrong{background:#fecdd3;border-color:#e11d48;color:#9f1239}.opt.disabled{pointer-events:none}.explanation{display:none;margin-top:12px;padding:12px;background:#fef3c7;border-radius:10px;border:2px solid #f59e0b;font-size:1rem;line-height:1.4}.explanation.show{display:block}.score-bar{position:sticky;top:10px;z-index:10;background:white;border:2px dashed #6b21a8;border-radius:15px;padding:12px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:2px 2px 0 #fbbf24}.score-text{font-family:'Bangers',cursive;color:#6b21a8;font-size:1.2rem}.progress-bar{width:200px;height:12px;background:#e9d5ff;border-radius:6px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#6b21a8,#be185d);border-radius:6px;transition:width 0.3s;width:0%}.reset-btn{background:#fbbf24;border:2px solid #f59e0b;color:#6b21a8;padding:8px 20px;border-radius:20px;font-family:'Patrick Hand',cursive;font-size:1.1rem;cursor:pointer}.reset-btn:hover{background:#f59e0b}</style></head><body><div class="container"><a href="../" class="back">← Back to Hub</a><h1>🎯 CRIM107 Quiz</h1><p class="subtitle">30 Questions • Instant Feedback • Click to answer</p><div class="score-bar"><span class="score-text" id="score">Score: 0 / 0</span><div class="progress-bar"><div class="progress-fill" id="progress"></div></div><button class="reset-btn" onclick="reset()">Reset 🔄</button></div><div id="quiz"></div></div><script>const questions=[{q:"Who coined the term 'victimology'?",opts:["Hans von Hentig","Benjamin Mendelsohn","Marvin Wolfgang","Beniamin Fattah"],ans:1,exp:"Benjamin Mendelsohn coined 'victimology' in 1940, though Von Hentig published his seminal work in 1948."},{q:"Which theory argues that crime occurs when a motivated offender, suitable target, and absent guardian converge?",opts:["Lifestyle Theory","Strain Theory","Routine Activity Theory","Social Learning Theory"],ans:2,exp:"Cohen & Felson (1979) Routine Activity Theory. The three-part heuristic explains why crime rates changed post-WWII despite rising prosperity."},{q:"The 'dark figure' of crime refers to:",opts:["Crimes committed at night","The gap between actual and recorded crime","Crime by unknown offenders","Serious violent offences"],ans:1,exp:"The dark figure is the gap between crimes that actually occur and those captured in official statistics. Most unreported: sexual assault, DV, household larceny."},{q:"What year was the UCR (Uniform Crime Reports) established?",opts:["1929","1931","1945","1973"],ans:1,exp:"The UCR was established in 1931 by the FBI, collecting data from ~18,000 agencies on Part I index offences."},{q:"Schreck (1999) found that low self-control is linked to:",opts:["Only offending behaviour","Both offending and victimisation","Only victimisation","Resilience to trauma"],ans:1,exp:"Schreck extended self-control theory to show that low self-control predicts victimisation too, because people take more risks and associate with offenders."},{q:"The ACE Study measures:",opts:["Adult Criminal Experiences","Adverse Childhood Experiences","Australian Crime Events","Adolescent Community Engagement"],ans:1,exp:"Adverse Childhood Experiences: 10 categories scored 0-10, linked to dramatically increased health risks and early death."},{q:"Walker's Cycle of Violence (IPV) has which phases?",opts:["Anger, Attack, Apology","Tension-building, Acute battering, Honeymoon","Warning, Violence, Calm","Provocation, Response, Resolution"],ans:1,exp:"Walker (1979): Tension-building → Acute battering incident → Honeymoon/reconciliation → Repeat (escalating each cycle)."},{q:"Which model argues prison violence stems from the 'pains of imprisonment'?",opts:["Importation Model","Deprivation Model","Management Model","Strain Model"],ans:1,exp:"Sykes (1958) Deprivation Model: prison culture develops IN RESPONSE to deprivation. Pains include loss of liberty, goods/services, heterosexual relationships, autonomy, security."},{q:"Aboriginal and Torres Strait Islander women are how many times more likely to be hospitalised for family violence?",opts:["5 times","12 times","32 times","50 times"],ans:2,exp:"32 times more likely to be hospitalised for family violence than non-Indigenous women."},{q:"Yar (2005) criticised applying RAT to cybercrime because:",opts:["It was too new","Online space lacks spatiotemporal convergence","Cybercrime doesn't have victims","It only works for property crime"],ans:1,exp:"Yar argued online space doesn't have the same physical convergence of offender/target/guardian. Called it 'old wine in new bottles' (p.424)."},{q:"What referencing style does CRIM107 use?",opts:["AGLC4","Harvard","APA 7th Edition","Chicago"],ans:2,exp:"CRIM107 uses APA 7th Edition. Your law units (LAW100, LAW101) use AGLC4."},{q:"The World Society of Victimology was founded in:",opts:["1956","1968","1979","1985"],ans:2,exp:"WSV founded 1979. Has ECOSOC consulting status and holds tri-annual symposia."},{q:"Which theory has 4 concepts: differential association, definitions, differential reinforcement, and imitation?",opts:["Strain Theory","Social Learning Theory (Akers)","Labelling Theory","Rational Choice Theory"],ans:1,exp:"Akers' Social Learning Theory. Criminal behaviour is LEARNED through these four mechanisms of social interaction."},{q:"The NCVS surveys people aged:",opts:["16 and over","12 and over","18 and over","10 and over"],ans:1,exp:"NCVS covers ages 12+. Households stay 3 years with 7 interviews at 6-month intervals."},{q:"On average, how many attempts does it take a woman to leave an abusive relationship?",opts:["3","5","7","10"],ans:2,exp:"7 attempts on average. The most dangerous point is when they leave (highest risk of escalation/homicide)."},{q:"Anderson's 'Code of the Street' (1999) describes:",opts:["Prison hierarchies","An informal system where respect is earned through violence in disadvantaged communities","Police procedural codes","Online harassment norms"],ans:1,exp:"In disadvantaged urban communities, respect/reputation becomes social currency. Violence used to maintain status."},{q:"What did Hawdon, Parti & Dearden (2020) find about COVID-19 and cybercrime?",opts:["Cybercrime tripled","Lockdown reduced street crime but did NOT increase cybercrime","All crime increased equally","Only financial fraud increased"],ans:1,exp:"Counterintuitive finding: despite more time online, cybercrime victimisation didn't increase during lockdowns."},{q:"DiIulio (1987) argued the key variable in prison victimisation is:",opts:["Prisoner demographics","Sentence length","Prison management quality","Overcrowding levels"],ans:2,exp:"Well-run prisons have less violence regardless of population characteristics. Management is the key variable."},{q:"Which is NOT one of Agnew's strain categories?",opts:["Loss of legal avenues","Experiences of negatively valued stimuli","Loss of positively valued stimuli","Exposure to criminal peers"],ans:3,exp:"Exposure to criminal peers is part of Social Learning Theory (differential association), not Strain Theory."},{q:"Von Hentig's (1948) work is criticised for:",opts:["Being too empirical","Victim-blaming orientation and lack of structural awareness","Ignoring offenders entirely","Being too modern"],ans:1,exp:"Von Hentig's work was sociobiological, never empirically supported, and adopted a victim-blaming orientation without addressing structural factors."},{q:"What percentage of violent crime victims experience socio-emotional problems?",opts:["45%","52%","68%","85%"],ans:2,exp:"68% of violent crime victims aged 12+ experience socio-emotional problems. More severe when victimised by someone known."},{q:"The Prosecution of Offences Act was passed in:",opts:["1829","1856","1879","1901"],ans:2,exp:"1879. Marked the formal shift from private to public prosecution, further marginalising victims in the justice process."},{q:"Collective efficacy is defined as:",opts:["Police presence in a community","Mutual trust + willingness to intervene for common good","CCTV and security systems","Community meetings about crime"],ans:1,exp:"Mutual trust among neighbours combined with willingness to intervene for the common good. Key protective factor against crime and victimisation."},{q:"The ecological fallacy (Robinson, 1950) means:",opts:["Environmental crime causes more harm than street crime","Making inferences about individuals from group-level data","Green spaces reduce crime","Animals can be victims too"],ans:1,exp:"Just because a neighbourhood has high crime doesn't mean every individual there is at risk. Can't infer individual outcomes from aggregate data."},{q:"What is the Victims Rights & Support Act (NSW) 2013?",opts:["Federal legislation for all of Australia","NSW Act with 18 rights in the Charter of Victim Rights","A UN declaration","A sentencing guideline"],ans:1,exp:"NSW state legislation containing 18 rights including right to courtesy/compassion, information, VIS, and compensation. 2-year time limit for claims."},{q:"Fattah's (1991) framework lists how many categories of victimisation factors?",opts:["5","7","10","13"],ans:2,exp:"10 categories: opportunities, risk factors, motivated offenders, exposure, associations, dangerous times/places, dangerous behaviours, high-risk activities, defensive behaviours, structural/cultural proneness."},{q:"What does the 'guardianship paradox' in cybercrime mean?",opts:["More police = more crime","Protective software may increase victimisation likelihood","Parents monitoring reduces cyberbullying","Guardians can't protect online"],ans:1,exp:"Marcum (2009) & Reyns (2010): Protective software had no effect or increased victimisation. Possibly due to false sense of security leading to riskier behaviour."},{q:"Widom's 'Cycle of Violence' research showed childhood _____ is a stronger predictor of adult violence than physical abuse.",opts:["Sexual abuse","Emotional abuse","Neglect","Witnessing DV"],ans:2,exp:"Re-analysis of Widom's data showed childhood neglect is actually a STRONGER predictor of adult violent behaviour than physical abuse."},{q:"Which is a limitation of the CSEW?",opts:["Only covers England & Wales (Scotland broke off)","Only surveys men","Doesn't include property crime","Only online responses"],ans:0,exp:"Scotland left the survey. Also: children only included since 2009 (ages 10-15), doesn't include homeless or institutionalised people."},{q:"The Terrence Williams case primarily illustrates:",opts:["Police misconduct","The victim-offender overlap","Cybercrime prosecution","Restorative justice success"],ans:1,exp:"Williams was sexually abused from age 6, then killed his abusers. At trial, NONE of his victimisation was raised. Demonstrates how the CJS fails to recognise victim-offender overlap."}];let answered=0,correct=0;function render(){const container=document.getElementById('quiz');container.innerHTML='';questions.forEach((q,i)=>{const div=document.createElement('div');div.className='q-card';div.innerHTML=`<div class="q-num">Question ${i+1}</div><div class="q-text">${q.q}</div><div class="options">${q.opts.map((o,j)=>`<div class="opt" data-q="${i}" data-o="${j}" onclick="answer(${i},${j})">${o}</div>`).join('')}</div><div class="explanation" id="exp-${i}">${q.exp}</div>`;container.appendChild(div)})}function answer(qi,oi){const opts=document.querySelectorAll(`[data-q="${qi}"]`);if(opts[0].classList.contains('disabled'))return;answered++;if(oi===questions[qi].ans){correct++;opts[oi].classList.add('correct')}else{opts[oi].classList.add('wrong');opts[questions[qi].ans].classList.add('correct')}opts.forEach(o=>o.classList.add('disabled'));document.getElementById(`exp-${qi}`).classList.add('show');updateScore()}function updateScore(){document.getElementById('score').textContent=`Score: ${correct} / ${answered}`;document.getElementById('progress').style.width=`${(answered/questions.length)*100}%`}function reset(){answered=0;correct=0;updateScore();render()}render()</script></body></html>
