<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CRIM107 Flashcards | UNE Study Hub</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Caveat:wght@500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Patrick Hand',cursive;background:#fce4ec;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}h1{font-family:'Bangers',cursive;color:#6b21a8;font-size:2.5rem;text-shadow:2px 2px 0 #fbbf24;margin-bottom:5px}.back{position:absolute;top:20px;left:20px;color:#6b21a8;text-decoration:none;font-size:1.2rem;border:2px dashed #6b21a8;padding:5px 15px;border-radius:20px}.back:hover{background:#6b21a8;color:white}.subtitle{font-family:'Caveat',cursive;color:#be185d;font-size:1.3rem;margin-bottom:20px}.card-container{perspective:1000px;width:100%;max-width:600px;height:350px;margin:20px 0;cursor:pointer}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.25,1,0.5,1)}.card.flipped{transform:rotateY(180deg)}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:1.3rem;line-height:1.5}.card-front{background:white;border:3px dashed #c084fc;box-shadow:4px 4px 0 #fbbf24}.card-back{background:linear-gradient(135deg,#ede9fe,#fce7f3);border:3px dashed #be185d;transform:rotateY(180deg);box-shadow:4px 4px 0 #10b981}.card-front .label{position:absolute;top:15px;left:20px;font-family:'Bangers',cursive;color:#6b21a8;font-size:1rem}.card-back .label{position:absolute;top:15px;left:20px;font-family:'Bangers',cursive;color:#be185d;font-size:1rem}.controls{display:flex;align-items:center;gap:20px;margin:15px 0}.btn{background:white;border:2px solid #6b21a8;color:#6b21a8;padding:10px 25px;border-radius:25px;font-family:'Patrick Hand',cursive;font-size:1.1rem;cursor:pointer;transition:all 0.2s}.btn:hover{background:#6b21a8;color:white;transform:scale(1.05)}.btn-shuffle{background:#fbbf24;border-color:#f59e0b;color:#6b21a8}.btn-shuffle:hover{background:#f59e0b}.counter{font-family:'Caveat',cursive;font-size:1.3rem;color:#6b21a8}.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:600px;margin-top:10px}.dot{width:10px;height:10px;border-radius:50%;background:#e9d5ff;transition:background 0.3s}.dot.active{background:#6b21a8}.dot.seen{background:#c084fc}.score{margin-top:15px;font-size:1.1rem;color:#6b21a8}.score span{font-weight:bold;color:#be185d}.tip{font-size:0.95rem;color:#6b21a8;margin-top:5px;opacity:0.7}</style></head><body><a href="../" class="back">← Back to Hub</a><h1>🃏 CRIM107 Flashcards</h1><p class="subtitle">Click card to flip • Arrows to navigate • 40 cards</p><div class="card-container" onclick="flipCard()"><div class="card" id="flashcard"><div class="card-face card-front"><span class="label">QUESTION</span><div id="q-text"></div></div><div class="card-face card-back"><span class="label">ANSWER</span><div id="a-text"></div></div></div></div><div class="controls"><button class="btn" onclick="prev()">← Prev</button><span class="counter" id="counter">1 / 40</span><button class="btn" onclick="next()">Next →</button><button class="btn btn-shuffle" onclick="shuffle()">Shuffle 🎲</button></div><div class="dots" id="dots"></div><div class="score">Cards seen: <span id="seen-count">0</span> / 40</div><p class="tip">Tap the card or press Space to flip</p><script>const cards=[{q:"What is victimology?",a:"The scientific study of victims and victimizations attributable to violations of human rights (Kirchhoff, 1994)"},{q:"Who coined the term 'victimology' and when?",a:"Benjamin Mendelsohn in 1940"},{q:"What are Mendelsohn's 6 victim types?",a:"1. Completely innocent\n2. Minor guilt (ignorance)\n3. As guilty as offender\n4. More guilty than offender (provocation)\n5. Most guilty (aggressor killed in self-defence)\n6. Imaginary victim (false claims)"},{q:"What is the 'dark figure' of crime?",a:"The gap between actual crime occurring and crime recorded in official statistics. Many crimes go unreported or undetected."},{q:"What year was the NCVS established?",a:"1973 (originally the National Crime Survey). US nationally representative sample, ages 12+, interviews every 6 months for 3 years."},{q:"What is the UCR hierarchy rule?",a:"When multiple offences occur in one incident, only the MOST SERIOUS offence is counted. This means less serious crimes are systematically undercounted."},{q:"Name the three elements of Routine Activity Theory.",a:"1. Motivated offender\n2. Suitable target\n3. Absence of a capable guardian\n(Cohen & Felson, 1979)"},{q:"What is Lifestyle Theory?",a:"Hindelang, Garofalo & Gottfredson (1978): Victimisation risk is shaped by lifestyle patterns (where you go, when, with whom). Demographics influence structural constraints which shape lifestyle and exposure to risk."},{q:"How does self-control relate to victimisation?",a:"Schreck (1999): Low self-control linked to victimisation because people take more risks, associate with offenders, and place themselves in dangerous situations. Confirmed by Pratt et al. (2014) meta-analysis of 66 studies."},{q:"What are the 4 concepts of Akers' Social Learning Theory?",a:"1. Differential Association (who you associate with)\n2. Definitions (attitudes toward behaviour)\n3. Differential Reinforcement (rewards vs punishments)\n4. Imitation (observing/copying others)"},{q:"What are Agnew's 3 categories of strain?",a:"1. Loss of legal avenues to achieve goals\n2. Loss of positively valued stimuli\n3. Experiences of negatively valued stimuli"},{q:"What did Widom's 'Cycle of Violence' find?",a:"Physical abuse in childhood increases likelihood of adult violent behaviour. BUT re-analysis showed childhood NEGLECT is actually a stronger predictor than physical abuse. Not inevitable: protective factors exist."},{q:"What is the ACE Study?",a:"Adverse Childhood Experiences: 10 categories scored 0-10. Higher score = dramatically increased risk of substance abuse, depression, suicide, heart disease, cancer, early death. Impacts brain/CNS development."},{q:"What is 'secondary victimisation'?",a:"Negative interactions with the criminal justice system that re-victimise. Example: half of rape victims report being treated poorly by police."},{q:"What are Victim Impact Statements?",a:"Written or oral statements by victims about how a crime affected them, presented at sentencing. Recognised in every US state + UK, Canada, Australia, NZ. Debate over whether they bias jurors."},{q:"What is the Broken Windows theory?",a:"Kelling (1982): Physical/social disorder signals that informal controls have broken down, leading to a spiral of decline and more crime. Disorder includes graffiti, abandoned buildings, public intoxication."},{q:"What is collective efficacy?",a:"Mutual trust + willingness to intervene for the common good in a neighbourhood. Weakened by victimisation (reciprocal relationship). Key protective factor against crime."},{q:"Name Walker's 3 phases in the Cycle of Violence (IPV).",a:"1. Tension-building phase\n2. Acute battering incident\n3. Honeymoon/reconciliation phase\nThen repeats (escalating)"},{q:"What stat describes Aboriginal women and family violence hospitalisation?",a:"Aboriginal and Torres Strait Islander women are 32 TIMES more likely to be hospitalised for family violence than non-Indigenous women."},{q:"What is the Deprivation Model of prison violence?",a:"Sykes (1958): 'Pains of imprisonment' create conditions for victimisation. Prison culture develops IN RESPONSE to deprivation. Argot roles: rats, gorillas, wolves, ball busters, real men."},{q:"What is the Importation Model?",a:"Pre-prison lives are imported into prison. Criminal history, gang membership, substance abuse, and antisocial attitudes carried in from outside. Challenges the idea that prison culture is purely situational."},{q:"What did DiIulio (1987) argue about prison victimisation?",a:"Prison MANAGEMENT is the key variable. Well-run prisons have less violence regardless of population characteristics."},{q:"What is Yar's (2005) critique of applying RAT to cybercrime?",a:"Called it 'old wine in new bottles' (p.424). 'Spatiotemporal ontology' issue: online space doesn't have the same convergence of offender/target/guardian in physical space."},{q:"What did Hawdon, Parti & Dearden (2020) find about COVID and cybercrime?",a:"Lockdown reduced street crime but did NOT increase cybercrime victimisation. Despite more time online, routine activities shifted in ways that didn't necessarily create more suitable targets."},{q:"What is the 'guardianship paradox' in cybercrime?",a:"Marcum (2009) & Reyns (2010): Protective software actually INCREASED or had no effect on victimisation likelihood. Possible explanation: false sense of security leads to riskier online behaviour."},{q:"When was the World Society of Victimology founded?",a:"1979. Has ECOSOC consulting status, holds tri-annual symposia. Four aims: research, advocacy, services, UN cooperation."},{q:"What is the UN Declaration of Basic Principles (1985)?",a:"UN Declaration of Basic Principles of Justice for Victims of Crime and Abuse of Power. Provides broad definition of victims including those harmed by abuse of power (not just crime)."},{q:"What is Von Hentig's contribution and its criticism?",a:"'The Criminal and His Victim' (1948): 13 victim classes, intelligence-victimisation link. CRITICISM: sociobiological, never empirically supported, victim-blaming orientation, no structural awareness."},{q:"What are the 3 approaches to victimology?",a:"1. Penal (Von Hentig): victim-offender interaction within criminal law\n2. General (Mendelsohn/Dussich): broader, lessening 'victimity'\n3. Human Rights (Elias/Kirchhoff): victims of state crime, structural violence"},{q:"What does NIBRS improve over UCR?",a:"22 crime categories (not just 8), 53 data elements per incident, NO hierarchy rule (records ALL offences), captures victim-offender relationship, injuries, weapons, property loss."},{q:"What is the ecological fallacy?",a:"Robinson (1950): Making inferences about individuals based on aggregate/group-level data. Just because a neighbourhood has high crime doesn't mean every individual there is at risk."},{q:"What is 'street efficacy'?",a:"Sharkey (2006): The ability to navigate dangerous environments without becoming a victim. A cognitive resource developed through experience in disadvantaged urban areas."},{q:"What did the Terrence Williams case demonstrate?",a:"The victim-offender overlap. Williams was sexually abused from age 6, yet at trial NONE of his victimisation was mentioned. Sentenced to death. 150+ legal professionals later signed petition for commutation."},{q:"What is Anderson's 'Code of the Street' (1999)?",a:"In disadvantaged urban communities, respect/reputation becomes social currency. Violence used to maintain status. An informal system of rules governing interpersonal behaviour."},{q:"How many attempts does it take on average for a woman to leave an abusive relationship?",a:"7 attempts on average before permanently leaving. The MOST DANGEROUS point is when they leave (highest risk of escalation/homicide)."},{q:"What referencing style does CRIM107 use?",a:"APA 7th Edition (NOT AGLC4 like the law units)"},{q:"What is the ICVS?",a:"International Crime Victims Survey (1989). Completed 5 times across 78 countries. Enables cross-national comparison. 3 crime groups: vehicle-related, breaking & entering, personal."},{q:"What are protective factors against the cycle of violence?",a:"Prosocial activities, school attachment, non-deviant peers, self-control, supportive social ties."},{q:"What is the Victims Rights & Support Act (NSW) 2013?",a:"Contains 18 rights in the Charter of Victim Rights: right to courtesy/compassion, right to information about investigation, right to give VIS, right to compensation. 2-year time limit for claims (3 exceptions)."},{q:"What is critical victimology?",a:"Emerged 1990s (Miers 1990). Challenged stereotypes of 'ideal victims' (white, middle-class, male). Examines structural inequality, power relations, how marginalised groups are disproportionately victimised."}];let current=0,seen=new Set();function init(){renderDots();show()}function renderDots(){const d=document.getElementById('dots');d.innerHTML='';cards.forEach((_,i)=>{const dot=document.createElement('div');dot.className='dot'+(i===current?' active':'')+(seen.has(i)?' seen':'');d.appendChild(dot)})}function show(){document.getElementById('flashcard').classList.remove('flipped');document.getElementById('q-text').textContent=cards[current].q;document.getElementById('a-text').textContent=cards[current].a;document.getElementById('counter').textContent=`${current+1} / ${cards.length}`;seen.add(current);document.getElementById('seen-count').textContent=seen.size;renderDots()}function flipCard(){document.getElementById('flashcard').classList.toggle('flipped')}function next(){current=(current+1)%cards.length;show()}function prev(){current=(current-1+cards.length)%cards.length;show()}function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}current=0;seen.clear();show()}document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flipCard()}else if(e.code==='ArrowRight')next();else if(e.code==='ArrowLeft')prev()});init()</script></body></html>
